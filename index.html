<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d4535">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AISB">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>AISB - Recueil Irlandais</title>
</head>
<body>
  <header>
    <img src="icons/icon-192.png" alt="">
    <h1>AISB · Recueil Irlandais</h1>
  </header>
  <div id="portrait" class="portrait">
    <main id="viewer" class="viewer-pane">
      <p class="muted">Sélectionnez une suite pour afficher les morceaux et les enregistrements.</p>
    </main>
    <aside class="controls">
      <div class="filter-zone">
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Tune..." autocomplete="off" aria-label="Rechercher un tune">
          <button id="clearSearch" class="clear-search" type="button" aria-label="Effacer la recherche" title="Effacer" hidden>×</button>
        </div>
        <div class="row">
          <div>
            <label for="num">Set#</label>
            <select id="num"><option value="">Tous</option></select>
          </div>
          <div>
            <label for="type">Set type</label>
            <select id="type"><option value="">Tous</option></select>
          </div>
        </div>
        <label class="favline"><input id="favorites" type="checkbox"> Favoris uniquement</label>
      </div>
      <div id="results" class="results"></div>
    </aside>
  </div>
  <div id="landscape" class="landscape">
    <div id="landscapeTitle" class="landscape-title" aria-live="polite"></div>
    <button id="pageFlip" class="page-flip" type="button" aria-label="Afficher la partition complète" title="Afficher la partition complète" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3h9a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm0 2a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8v-4a3 3 0 0 1 3-3V6a1 1 0 0 0-1-1H6Zm10 12.6 1.6-1.6H17a1 1 0 0 0-1 1v.6Z"/>
      </svg>
    </button>
    <div id="sheetViewport" class="sheet-viewport">
      <div id="sheetStage" class="sheet-stage">
        <img id="sheet" class="sheet" alt="Partition">
      </div>
    </div>
    <p id="sheetMessage" class="muted">Sélectionnez d'abord une suite en mode vertical, puis tournez le téléphone.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
